<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hotel Search Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --gold: #c9a84c;
      --gold-dim: #8a6f2e;
      --text: #e8e0d0;
      --muted: #666;
      --error: #e05555;
      --success: #5aad7e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* HEADER */
    header {
      border-bottom: 1px solid var(--border);
      padding: 36px 48px 28px;
      display: flex;
      align-items: flex-end;
      gap: 20px;
      animation: fadeDown 0.6s ease both;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
    }

    header h1 span { color: var(--gold); font-style: italic; }

    .badge {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      padding: 4px 10px;
      margin-bottom: 6px;
    }

    /* MAIN LAYOUT */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 48px 0;
    }

    /* SEARCH FORM */
    .search-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px;
      margin-bottom: 40px;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    .panel-title {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input:focus { border-color: var(--gold); }
    input::placeholder { color: var(--muted); }

    .btn-search {
      background: var(--gold);
      color: #0d0d0d;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 32px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      align-self: flex-end;
    }

    .btn-search:hover { background: #dfc070; }
    .btn-search:active { transform: scale(0.98); }
    .btn-search:disabled { background: var(--gold-dim); cursor: not-allowed; }

    /* RAW REQUEST PREVIEW */
    .request-preview {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold-dim);
      padding: 14px 18px;
      font-size: 0.72rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 16px;
    }

    .request-preview span { color: var(--gold); }

    /* STATUS BAR */
    #status-bar {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      padding: 10px 0;
      min-height: 32px;
      color: var(--muted);
    }

    #status-bar.loading { color: var(--gold); }
    #status-bar.error { color: var(--error); }
    #status-bar.success { color: var(--success); }

    /* RESULTS */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      animation: fadeUp 0.4s ease both;
    }

    .hotel-card {
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeUp 0.4s ease both;
    }

    .hotel-card:hover {
      border-color: var(--gold-dim);
      transform: translateY(-2px);
    }

    .hotel-thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #1e1e1e;
    }

    .hotel-thumb-placeholder {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #1e1e1e 0%, #242424 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--muted);
    }

    .hotel-body { padding: 20px; }

    .hotel-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .hotel-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .rating {
      background: var(--gold);
      color: #0d0d0d;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 2px 7px;
    }

    .reviews { font-size: 0.65rem; color: var(--muted); }

    .hotel-desc {
      font-size: 0.72rem;
      color: #999;
      line-height: 1.6;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hotel-price {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .price-label { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; }
    .price-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: var(--gold);
    }

    .hotel-link {
      font-size: 0.62rem;
      color: var(--gold-dim);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hotel-link:hover { color: var(--gold); }

    /* RAW JSON PANEL */
    .json-panel {
      margin-top: 40px;
      border: 1px solid var(--border);
      animation: fadeUp 0.4s ease both;
    }

    .json-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
    }

    .json-title {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .btn-copy {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .btn-copy:hover { color: var(--text); border-color: var(--text); }

    pre#raw-json {
      background: #0a0a0a;
      padding: 20px;
      font-size: 0.7rem;
      line-height: 1.7;
      overflow-x: auto;
      color: #aaa;
      max-height: 400px;
      overflow-y: auto;
    }

    /* EMPTY STATE */
    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-state p { font-size: 0.75rem; letter-spacing: 0.1em; }

    /* ANIMATIONS */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 768px) {
      header { padding: 24px 20px 20px; }
      main { padding: 24px 20px 0; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-grid .field:first-child { grid-column: 1/-1; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="badge">API Tester</div>
    <h1>Hotel <span>Search</span></h1>
  </div>
</header>

<main>
  <!-- SEARCH PANEL -->
  <div class="search-panel">
    <div class="panel-title">// Search Parameters</div>

    <div class="form-grid">
      <div class="field">
        <label>Destination / Query</label>
        <input type="text" id="q" placeholder="Paris, Eiffel Tower, New York..." value="Paris"/>
      </div>
      <div class="field">
        <label>Check-in Date</label>
        <input type="date" id="check_in"/>
      </div>
      <div class="field">
        <label>Check-out Date</label>
        <input type="date" id="check_out"/>
      </div>
      <div class="field">
        <label>Adults</label>
        <input type="number" id="adults" value="2" min="1" max="10"/>
      </div>
    </div>

    <div style="display:flex; align-items:flex-end; gap:16px;">
      <button class="btn-search" id="search-btn" onclick="searchHotels()">Search Hotels</button>
      <div id="request-preview" class="request-preview" style="flex:1">
        <span>GET</span> /api/hotels?q=<span id="prev-q">Paris</span>&check_in=<span id="prev-in">—</span>&check_out=<span id="prev-out">—</span>&adults=<span id="prev-adults">2</span>
      </div>
    </div>
  </div>

  <!-- STATUS -->
  <div id="status-bar">Ready — enter a destination and click Search</div>

  <!-- RESULTS GRID -->
  <div id="results">
    <div class="empty-state">
      <div class="icon">🏨</div>
      <p>Results will appear here</p>
    </div>
  </div>

  <!-- RAW JSON -->
  <div id="json-section" class="json-panel" style="display:none">
    <div class="json-header">
      <span class="json-title">// Raw API Response</span>
      <button class="btn-copy" onclick="copyJson()">Copy JSON</button>
    </div>
    <pre id="raw-json"></pre>
  </div>
</main>

<script>
  // Set default dates (today + 7 days)
  const today = new Date();
  const nextWeek = new Date(today);
  nextWeek.setDate(today.getDate() + 7);
  const nextWeekOut = new Date(today);
  nextWeekOut.setDate(today.getDate() + 10);

  document.getElementById('check_in').value = today.toISOString().split('T')[0];
  document.getElementById('check_out').value = nextWeek.toISOString().split('T')[0];

  // Live preview update
  ['q','check_in','check_out','adults'].forEach(id => {
    document.getElementById(id).addEventListener('input', updatePreview);
  });

  function updatePreview() {
    document.getElementById('prev-q').textContent = document.getElementById('q').value || '—';
    document.getElementById('prev-in').textContent = document.getElementById('check_in').value || '—';
    document.getElementById('prev-out').textContent = document.getElementById('check_out').value || '—';
    document.getElementById('prev-adults').textContent = document.getElementById('adults').value || '2';
  }

  updatePreview();

  async function searchHotels() {
    const q = document.getElementById('q').value.trim();
    const check_in = document.getElementById('check_in').value;
    const check_out = document.getElementById('check_out').value;
    const adults = document.getElementById('adults').value;

    if (!q) {
      setStatus('error', '⚠ Please enter a destination');
      return;
    }

    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    setStatus('loading', '⟳ Fetching hotels from SerpAPI...');
    document.getElementById('results').innerHTML = '';
    document.getElementById('json-section').style.display = 'none';

    const params = new URLSearchParams({ q, adults });
    if (check_in) params.append('check_in', check_in);
    if (check_out) params.append('check_out', check_out);

    try {
      const res = await fetch(`/api/hotels?${params}`);
      const data = await res.json();

      if (!res.ok) throw new Error(data.details || data.error || 'API Error');

      renderResults(data.hotels);
      renderJson(data);
      setStatus('success', `✓ Found ${data.total} hotels for "${q}"`);
    } catch (err) {
      setStatus('error', `✗ Error: ${err.message}`);
      document.getElementById('results').innerHTML = `<div class="empty-state"><div class="icon">⚠</div><p>${err.message}</p></div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function renderResults(hotels) {
    if (!hotels || hotels.length === 0) {
      document.getElementById('results').innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No hotels found</p></div>`;
      return;
    }

    const html = hotels.map((h, i) => `
      <div class="hotel-card" style="animation-delay:${i * 0.05}s">
        ${h.thumbnail
          ? `<img class="hotel-thumb" src="${h.thumbnail}" alt="${h.name}" onerror="this.parentElement.querySelector('.hotel-thumb-placeholder') && (this.style.display='none')">`
          : `<div class="hotel-thumb-placeholder">🏨</div>`
        }
        <div class="hotel-body">
          <div class="hotel-name">${h.name}</div>
          <div class="hotel-meta">
            ${h.rating ? `<span class="rating">★ ${h.rating}</span>` : ''}
            ${h.reviews ? `<span class="reviews">${h.reviews.toLocaleString()} reviews</span>` : ''}
          </div>
          ${h.description ? `<div class="hotel-desc">${h.description}</div>` : ''}
          <div class="hotel-price">
            <div>
              <div class="price-label">Per Night</div>
              <div class="price-value">${h.price !== 'N/A' ? h.price : '—'}</div>
            </div>
            ${h.link ? `<a class="hotel-link" href="${h.link}" target="_blank">View →</a>` : ''}
          </div>
        </div>
      </div>
    `).join('');

    document.getElementById('results').innerHTML = html;
  }

  function renderJson(data) {
    document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2);
    document.getElementById('json-section').style.display = 'block';
  }

  function copyJson() {
    const text = document.getElementById('raw-json').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.btn-copy');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy JSON', 1500);
    });
  }

  function setStatus(type, msg) {
    const el = document.getElementById('status-bar');
    el.className = type;
    el.textContent = msg;
  }

  // Search on Enter key
  document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchHotels();
  });
</script>
</body>
</html>
